<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekend Cricket</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07140f;color:#eef8f2}
header{padding:22px 18px;background:#0d2419;border-bottom:1px solid #214c35;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:25px}.sub{color:#9db9aa;font-size:13px;margin-top:5px}
nav{display:flex;gap:7px;overflow:auto;margin-top:16px}nav button,.btn{border:0;border-radius:10px;padding:10px 14px;background:#173a28;color:#dff4e6;cursor:pointer}nav button.active,.primary{background:#2d8a54;color:white}
main{max-width:900px;margin:auto;padding:18px}.hero,.card{background:#0d2118;border:1px solid #1e4932;border-radius:16px;padding:18px;margin-bottom:15px}
.hero h2{margin:0 0 7px}.muted{color:#9db9aa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card h3{margin-top:0}.playerrow{display:flex;align-items:center;gap:6px;margin:7px 0}.player{flex:1;text-align:left;background:#173a28;border:0;border-radius:9px;padding:10px;color:white}.delete{width:34px;background:#48201f;color:#ffb5b0;border:0;border-radius:9px;padding:9px;cursor:pointer}
.team{min-height:100px}.team-head{display:flex;justify-content:space-between;align-items:center}.small{font-size:12px}
.update{padding:10px 0;border-bottom:1px solid #1c3d2c}.update:last-child{border:0}
.tossbox{text-align:center}.coin{width:80px;height:80px;border-radius:50%;background:#d9b44a;color:#332500;display:flex;align-items:center;justify-content:center;margin:15px auto;font-weight:bold;font-size:18px;box-shadow:0 4px 15px #0005}.choice{display:flex;gap:8px;justify-content:center;margin:10px 0}.choice button{flex:1;max-width:180px}.selected{outline:2px solid #69d18e;background:#225f3d!important}
.modalback{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:min(500px,100%);background:#0d2118;border:1px solid #2b6445;border-radius:16px;padding:20px}.modal h3{margin-top:0}.modal input{width:100%;padding:12px;border-radius:9px;border:1px solid #37674d;background:#07140f;color:white;margin:8px 0 13px}.listbtn{display:block;width:100%;text-align:left;margin:7px 0}.close{float:right;background:none;border:0;color:#aaa;font-size:24px;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d4f34;padding:12px 18px;border-radius:10px;display:none;z-index:30}
@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>
<header>
<h1>🏏 Weekend Cricket</h1>
<div class="sub">Live shared cricket team manager</div>
<nav>
<button data-section="teams" onclick="showSection('teams')">Teams</button>
<button data-section="toss" onclick="showSection('toss')">Toss</button>
<button data-section="updates" onclick="showSection('updates')">Updates</button>
<button data-section="settings" onclick="showSection('settings')">Settings</button>
</nav>
</header>

<main>
<section id="teams">
<div class="hero"><h2 id="matchName">Weekend Cricket</h2><div class="muted"><span id="playerCount">0</span> players</div></div>
<div class="card"><div class="team-head"><h3>All Players</h3><button class="btn primary" onclick="openAddPlayer()">+ Add Player</button></div><div id="players"></div></div>
<div class="grid">
<div class="card team"><div class="team-head"><h3 id="teamAName">Captain A</h3><button class="btn" onclick="openAssign('A')">Assign</button></div><div id="teamA"></div></div>
<div class="card team"><div class="team-head"><h3 id="teamBName">Captain B</h3><button class="btn" onclick="openAssign('B')">Assign</button></div><div id="teamB"></div></div>
</div>
</section>

<section id="toss" style="display:none">
<div class="card tossbox">
<h2>🪙 Coin Toss</h2>
<p class="muted">Flipping as: <strong id="flipperName">Guest</strong></p>
<p>Which captain are you flipping on behalf of?</p>
<div class="choice"><button id="captainChoiceA" class="btn" onclick="chooseCaptain('A')">Captain A</button><button id="captainChoiceB" class="btn" onclick="chooseCaptain('B')">Captain B</button></div>
<p>Which side is the captain calling?</p>
<div class="choice"><button id="headsBtn" class="btn" onclick="chooseSide('Heads')">HEADS</button><button id="tailsBtn" class="btn" onclick="chooseSide('Tails')">TAILS</button></div>
<div class="coin" id="coin">?</div>
<button class="btn primary" onclick="flip()" style="width:100%;max-width:370px">FLIP COIN</button>
<div id="tossResult" style="margin-top:15px"></div>
</div>
</section>

<section id="updates" style="display:none"><div class="card">
<div class="team-head"><h2>Recent Updates</h2><button class="btn" onclick="clearUpdates()">Clear All</button></div>
<div id="updatesList"></div></div></section>

<section id="settings" style="display:none"><div class="card"><h2>Settings</h2>
<label>Match name</label><input id="matchInput" class="modalInput" style="width:100%;padding:11px;background:#07140f;color:white;border:1px solid #37674d;border-radius:9px;margin:6px 0 12px">
<label>Captain A</label><input id="captainAInput" class="modalInput" style="width:100%;padding:11px;background:#07140f;color:white;border:1px solid #37674d;border-radius:9px;margin:6px 0 12px">
<label>Captain B</label><input id="captainBInput" class="modalInput" style="width:100%;padding:11px;background:#07140f;color:white;border:1px solid #37674d;border-radius:9px;margin:6px 0 12px">
<button class="btn primary" onclick="saveSettings()">Save Settings</button>
<button class="btn" onclick="changeUserName()" style="margin-left:7px">Change my name</button>
</div></section>
</main>

<div class="modalback" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const CONFIG={url:"https://eldkosreggeddorvjzdi.supabase.co",key:"sb_publishable_TaSGPB43zh0FJzhS0-3grg_OEI_UPxE"};
const db=supabase.createClient(CONFIG.url,CONFIG.key);
let players=[],settings={match_name:"Weekend Cricket",captain_a:"Captain A",captain_b:"Captain B"};
let selectedCaptain=null,selectedSide=null,currentUserName=localStorage.getItem("weekend_cricket_user_name")||"";

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}
function openModal(html){document.getElementById("modal").innerHTML=html;document.getElementById("modalBack").style.display="flex"}
function closeModal(){document.getElementById("modalBack").style.display="none"}
function currentUser(){return currentUserName||"Guest"}

function openUserModal(force=false){
 if(!force && currentUserName)return;
 openModal(`<button class="close" onclick="closeModal()">×</button><h3>Welcome to Weekend Cricket</h3><p class="muted">Enter your name. It will be remembered on this browser.</p><input id="userNameInput" placeholder="Your name" value="${esc(currentUserName)}"><button class="btn primary" onclick="saveUserName()">Continue</button>`);
 setTimeout(()=>document.getElementById("userNameInput")?.focus(),50);
}
function saveUserName(){
 const n=document.getElementById("userNameInput").value.trim();
 if(!n)return toast("Please enter your name");
 currentUserName=n;localStorage.setItem("weekend_cricket_user_name",n);document.getElementById("flipperName").textContent=n;closeModal();toast("Name saved");
}
function changeUserName(){openUserModal(true)}

function showSection(s){
 document.querySelectorAll("main>section").forEach(x=>x.style.display=x.id===s?"block":"none");
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.section===s));
 if(s==="toss")updateTossNames();
}
function updateTossNames(){
 document.getElementById("flipperName").textContent=currentUser();
 document.getElementById("captainChoiceA").textContent=settings.captain_a||"Captain A";
 document.getElementById("captainChoiceB").textContent=settings.captain_b||"Captain B";
}
function chooseCaptain(t){selectedCaptain=t;document.getElementById("captainChoiceA").classList.toggle("selected",t==="A");document.getElementById("captainChoiceB").classList.toggle("selected",t==="B")}
function chooseSide(s){selectedSide=s;document.getElementById("headsBtn").classList.toggle("selected",s==="Heads");document.getElementById("tailsBtn").classList.toggle("selected",s==="Tails")}

function render(){
 document.getElementById("matchName").textContent=settings.match_name||"Weekend Cricket";
 document.getElementById("teamAName").textContent=settings.captain_a||"Captain A";
 document.getElementById("teamBName").textContent=settings.captain_b||"Captain B";
 document.getElementById("playerCount").textContent=players.length;
 document.getElementById("players").innerHTML=players.map(p=>`<div class="playerrow"><button class="player" onclick="togglePlayer('${p.id}')">${esc(p.name)} ${p.team?`<span class="small muted">(${p.team==="A"?esc(settings.captain_a):esc(settings.captain_b)})</span>`:""}</button><button class="delete" title="Remove player" onclick="deletePlayer('${p.id}',event)">×</button></div>`).join("")||'<p class="muted">No players yet.</p>';
 document.getElementById("teamA").innerHTML=players.filter(p=>p.team==="A").map(p=>`<div class="playerrow"><button class="player">${esc(p.name)}</button><button class="delete" title="Remove from team" onclick="removeFromTeam('${p.id}',event)">×</button></div>`).join("")||'<p class="muted">No players assigned.</p>';
 document.getElementById("teamB").innerHTML=players.filter(p=>p.team==="B").map(p=>`<div class="playerrow"><button class="player">${esc(p.name)}</button><button class="delete" title="Remove from team" onclick="removeFromTeam('${p.id}',event)">×</button></div>`).join("")||'<p class="muted">No players assigned.</p>';
 document.getElementById("matchInput").value=settings.match_name||"";
 document.getElementById("captainAInput").value=settings.captain_a||"";
 document.getElementById("captainBInput").value=settings.captain_b||"";
 updateTossNames();
}
function togglePlayer(id){const p=players.find(x=>x.id===id);if(p)toast(p.name+(p.team?` is with ${p.team==="A"?settings.captain_a:settings.captain_b}`:" is unassigned"))}
async function removeFromTeam(id,e){
 e.stopPropagation();
 const p=players.find(x=>x.id===id);
 if(!p||!p.team)return;
 const oldCaptain=p.team==="A"?settings.captain_a:settings.captain_b;
 if(!confirm(`Remove ${p.name} from ${oldCaptain}'s team?`))return;
 const {error}=await db.from("players").update({team:null}).eq("id",id);
 if(error)return toast(error.message);
 await addUpdateText(`${currentUser()} removed ${p.name} from ${oldCaptain}'s team.`);
 toast(`${p.name} is now unassigned`);
}
async function deletePlayer(id,e){
 e.stopPropagation();const p=players.find(x=>x.id===id);if(!p)return;
 if(!confirm(`Remove ${p.name} completely from All Players?`))return;
 const {error}=await db.from("players").delete().eq("id",id);if(error)return toast(error.message);
 await addUpdateText(`${currentUser()} removed ${p.name} from the player list.`);
 toast("Player removed");
}
function openAddPlayer(){openModal(`<button class="close" onclick="closeModal()">×</button><h3>Add Player</h3><input id="newPlayer" placeholder="Player name"><button class="btn primary" onclick="addPlayer()">Add Player</button>`);setTimeout(()=>document.getElementById("newPlayer")?.focus(),50)}
async function addPlayer(){const n=document.getElementById("newPlayer").value.trim();if(!n)return toast("Enter a player name");const {error}=await db.from("players").insert({name:n});if(error)return toast(error.message);await addUpdateText(`${currentUser()} added ${n} to All Players.`);closeModal();toast("Player added")}
function openAssign(team){
 const available=players.filter(p=>!p.team);
 const captain=team==="A"?settings.captain_a:settings.captain_b;
 openModal(`<button class="close" onclick="closeModal()">×</button><h3>Add players to ${esc(captain)}</h3>${available.length?available.map(p=>`<button class="btn listbtn" onclick="assignPlayer('${p.id}','${team}')">${esc(p.name)}</button>`).join(""):'<p class="muted">No unassigned players available.</p>'}`);
}
async function assignPlayer(id,team){const p=players.find(x=>x.id===id);if(!p||p.team)return;const {error}=await db.from("players").update({team}).eq("id",id);if(error)return toast(error.message);const captain=team==="A"?settings.captain_a:settings.captain_b;await addUpdateText(`${currentUser()} assigned ${p.name} to ${captain}.`);openAssign(team);toast(`${p.name} added to ${captain}`)}
async function saveSettings(){
 const match=document.getElementById("matchInput").value.trim()||"Weekend Cricket",a=document.getElementById("captainAInput").value.trim()||"Captain A",b=document.getElementById("captainBInput").value.trim()||"Captain B";
 const {error}=await db.from("settings").upsert({id:1,match_name:match,captain_a:a,captain_b:b});if(error)return toast(error.message);await addUpdateText(`${currentUser()} updated the match settings.`);toast("Settings saved")
}

async function addUpdateText(text){
 const {error}=await db.from("updates").insert({text});if(error)console.error(error);
}
async function clearUpdates(){
 if(!confirm("Delete all Recent Updates? This will remove them for everyone."))return;
 const {error}=await db.from("updates").delete().not("id","is",null);
 if(error)return toast(error.message);
 toast("Recent Updates cleared");
 load();
}
function displayToss(d){
 const coin=document.getElementById("coin");coin.textContent="🪙";coin.animate([{transform:"rotateY(0deg)"},{transform:"rotateY(720deg)"},{transform:"rotateY(1440deg)"}],{duration:850});
 setTimeout(()=>{coin.textContent=d.result.toUpperCase();document.getElementById("tossResult").innerHTML=`<strong>${esc(d.result)} — ${esc(d.winner)} won the toss!</strong><br><span class="muted">Flipped by ${esc(d.flipper)} on behalf of ${esc(d.captain)}. ${esc(d.captain)} called ${esc(d.choice)}.</span>`},850);
}
async function flip(){
 if(!currentUserName){openUserModal(true);return}
 if(!selectedCaptain||!selectedSide)return toast("Choose captain and Heads/Tails first");
 const captain=settings[selectedCaptain==="A"?"captain_a":"captain_b"]||`Captain ${selectedCaptain}`;
 const other=settings[selectedCaptain==="A"?"captain_b":"captain_a"]||`Captain ${selectedCaptain==="A"?"B":"A"}`;
 const result=Math.random()<.5?"Heads":"Tails",winner=result===selectedSide?captain:other;
 const d={result,winner,flipper:currentUserName,captain,choice:selectedSide};
 displayToss(d);
 await channel.send({type:"broadcast",event:"coin_toss",payload:d});
 await addUpdateText(`🪙 ${result} — ${winner} won the toss. Flipped by ${currentUserName} on behalf of ${captain}; ${captain} called ${selectedSide}.`);
}

let channel=db.channel("weekend-cricket-live");
channel.on("broadcast",{event:"coin_toss"},({payload})=>displayToss(payload)).subscribe();

async function load(){
 const [s,p,u]=await Promise.all([db.from("settings").select("*").eq("id",1).maybeSingle(),db.from("players").select("*").order("created_at",{ascending:true}),db.from("updates").select("*").order("created_at",{ascending:false}).limit(30)]);
 if(s.data)settings=s.data;if(p.data)players=p.data;
 render();
 document.getElementById("updatesList").innerHTML=(u.data||[]).map(x=>`<div class="update">${esc(x.text)}<div class="small muted">${new Date(x.created_at).toLocaleString()}</div></div>`).join("")||'<p class="muted">No updates yet.</p>';
}
db.channel("weekend-cricket-db").on("postgres_changes",{event:"*",schema:"public",table:"players"},load).on("postgres_changes",{event:"*",schema:"public",table:"settings"},load).on("postgres_changes",{event:"*",schema:"public",table:"updates"},load).subscribe();

showSection("teams");load();setTimeout(()=>openUserModal(false),300);
</script>
</body>
</html>
